<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Instagram Outreach CRM</title>
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <!--
    Why this popup exists.

    The toolbar icon uses a popup rather than chrome.action.onClicked, because
    onClicked can only be handled by a background script and this extension
    deliberately has none. A popup is a real page: it renders from the packaged
    files and cannot fail to "register". Everything it does uses chrome.tabs
    directly, so the icon works even with no service worker anywhere.
  -->
  <div class="popup__brand">
    <div class="popup__logo"><svg class="logo-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 6c0-1.65685 1.3431-3 3-3s3 1.34315 3 3M9 6c0 1.04349.53275 1.96254 1.3411 2.5M9 6C7.34315 6 6 7.34315 6 9c0 1.6569 1.34315 3 3 3m6.3893 0c1.6568 0 3-1.3431 3-3 0-1.65685-1.3432-3-3-3-.6134 0-1.1838.18408-1.6589.5M8 12h8l-4 9-4-9Z"/></svg></div>
    <div>
      <div class="popup__title">Outreach CRM</div>
      <div class="popup__sub">Runs locally</div>
    </div>
  </div>

  <button class="popup__btn popup__btn--primary" id="open-dashboard">Open the dashboard</button>
  <button class="popup__btn" id="open-outreach">Go straight to Outreach</button>

  <div class="popup__status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
